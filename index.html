<body>
  <header class="bar">
    <div class="brand">
      <h1>molecules.fyi</h1>
      <span class="tag">molecular model kit</span>
      <a class="tag-link" href="teachers.html">For teachers</a>
      <span id="updated" class="updated"></span>
    </div>
    <div class="actions">
      <select id="examples" aria-label="Load an example">
        <option value="" disabled selected>Examples…</option>
      </select>
      <button id="save" title="Save this model to a file">Save</button>
      <button id="open" title="Open a saved model file">Load</button>
      <input id="open-file" type="file" accept=".json,application/json" hidden>
      <button id="undo" title="Undo (Ctrl/⌘ Z)" disabled>Undo</button>
      <button id="fit">Fit view</button>
      <button id="clear">Clear</button>
    </div>
  </header>
  <main>
    <aside class="palette" aria-label="Atoms">
      <div id="box" class="box"></div>
    </aside>
    <section class="stage">
      <canvas id="scene"></canvas>
      <nav class="tools" aria-label="Tools">
        <button data-tool="add">Build</button>
        <button data-tool="link">Link</button>
        <button data-tool="delete">Delete</button>
      </nav>
      <p id="hint" class="hint"></p>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <div class="zoom" role="group" aria-label="Zoom">
        <button id="zoom-in" title="Zoom in (+)" aria-label="Zoom in">+</button>
        <button id="zoom-out" title="Zoom out (-)" aria-label="Zoom out">&minus;</button>
      </div>
      <div class="readout">
        <div id="name" class="name" hidden></div>
        <div id="subname" class="subname" hidden></div>
        <div id="formula" class="formula">&mdash;</div>
        <div id="details" class="details"></div>
      </div>
      <dl class="help" aria-label="Moving things around">
        <dt>Turn the view</dt><dd>drag empty space</dd>
        <dt>Zoom</dt><dd>scroll, pinch or + −</dd>
        <dt>Pan</dt><dd>right-drag, Shift-drag or two fingers</dd>
        <dt>Turn a piece</dt><dd>drag an atom</dd>
        <dt>Twist a bond</dt><dd>drag a link</dd>
      </dl>
    </section>
  </main>
